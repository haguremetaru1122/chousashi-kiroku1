<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#24785a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="1周目の記録">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<title>調査士 1周目の記録</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=BIZ+UDPMincho:wght@400;700&display=swap">
<style>html{-webkit-text-size-adjust:100%}body{margin:0}:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}[hidden]{display:none!important}

:root {
  --paper: #f5f7f4;
  --grid: rgba(47, 93, 138, 0.07);
  --surface: #ffffff;
  --ink: #1d2830;
  --ink-soft: #55646e;
  --rule: #d6ddd9;
  --accent: #2f5d8a;
  --accent-soft: #e3ecf5;
  --good: #24785a;
  --good-soft: #e1f1ea;
  --bad: #c0402c;
  --bad-soft: #f8e5e1;
  --shadow: 0 1px 2px rgba(29, 40, 48, 0.06), 0 4px 16px rgba(29, 40, 48, 0.05);
  --gothic: "BIZ UDPGothic", "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
  --mincho: "BIZ UDPMincho", "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif JP", serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --paper: #11171b;
    --grid: rgba(127, 168, 214, 0.06);
    --surface: #192127;
    --ink: #e4e9ec;
    --ink-soft: #9aa8b1;
    --rule: #2c3840;
    --accent: #85afdc;
    --accent-soft: #1f3245;
    --good: #5cc79c;
    --good-soft: #173328;
    --bad: #f08a76;
    --bad-soft: #3a211c;
    --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --paper: #11171b;
  --grid: rgba(127, 168, 214, 0.06);
  --surface: #192127;
  --ink: #e4e9ec;
  --ink-soft: #9aa8b1;
  --rule: #2c3840;
  --accent: #85afdc;
  --accent-soft: #1f3245;
  --good: #5cc79c;
  --good-soft: #173328;
  --bad: #f08a76;
  --bad-soft: #3a211c;
  --shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
}

* { box-sizing: border-box; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font-family: var(--gothic);
  font-size: 16px;
  line-height: 1.7;
  padding-inline: 16px;
  padding-block: 0 48px;
}
.wrap { max-width: 720px; margin: 0 auto; display: grid; gap: 20px; }
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible, a:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }

/* ヘッダー */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5;
  background: var(--paper);
  border-bottom: 1px solid var(--rule);
  margin-inline: -16px; padding: 12px 16px;
}
.top-in { max-width: 720px; margin: 0 auto; display: flex; align-items: center; gap: 12px; }
.brand { font-weight: 700; font-size: 17px; letter-spacing: 0.04em; margin-right: auto; }
.brand small { font-weight: 400; color: var(--ink-soft); font-size: 12px; margin-left: 8px; letter-spacing: 0.02em; }
.round { font-weight: 700; font-size: 12px; color: var(--accent); background: var(--accent-soft); border-radius: 6px; padding: 2px 8px; margin-left: 8px; vertical-align: 2px; letter-spacing: 0.02em; }
.sync { font-size: 12px; color: var(--ink-soft); white-space: nowrap; }
.ghost { background: none; border: 1px solid var(--rule); border-radius: 8px; padding: 6px 12px; font-size: 14px; }

/* ホーム */
.hero { padding-top: 24px; display: grid; gap: 4px; }
.hero h1 { font-size: 24px; margin: 0; text-wrap: balance; letter-spacing: 0.02em; }
.hero p { margin: 0; color: var(--ink-soft); font-size: 14px; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 1px; background: var(--rule); border: 1px solid var(--rule); border-radius: 10px; overflow: hidden; }
.stat { background: var(--surface); padding: 12px 14px; display: grid; gap: 2px; }
.stat b { font-size: 22px; font-variant-numeric: tabular-nums; }
.stat span { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.04em; }

.label { font-size: 12px; color: var(--ink-soft); letter-spacing: 0.08em; margin: 0 0 8px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--rule); background: var(--surface); border-radius: 999px;
  padding: 8px 16px; font-size: 15px; min-height: 44px;
}
.chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--surface); font-weight: 700; }
.chip:disabled { opacity: 0.45; cursor: default; }

.modes { display: grid; gap: 12px; }
.mode {
  display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 16px;
  text-align: left; background: var(--surface); border: 1px solid var(--rule); border-radius: 12px;
  padding: 16px; box-shadow: var(--shadow); min-height: 84px;
}
.mode:hover { border-color: var(--accent); }
.mode:disabled { opacity: 0.5; cursor: default; box-shadow: none; }
.mode .mk { width: 56px; height: 56px; border-radius: 10px; display: grid; place-items: center; font-size: 22px; font-weight: 700; background: var(--accent-soft); color: var(--accent); font-family: var(--mincho); }
.mode h2 { font-size: 18px; margin: 0; }
.mode p { margin: 0; font-size: 13px; color: var(--ink-soft); }
.mode .count { font-variant-numeric: tabular-nums; font-size: 14px; color: var(--ink-soft); }

.list { display: grid; gap: 8px; }
.row { display: flex; gap: 12px; align-items: baseline; padding: 10px 0; border-bottom: 1px dashed var(--rule); font-size: 14px; }
.row .id { font-variant-numeric: tabular-nums; color: var(--accent); font-weight: 700; white-space: nowrap; }
.row .t { color: var(--ink-soft); }

/* 問題画面 */
.qhead { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 12px; padding-top: 16px; font-size: 13px; color: var(--ink-soft); }
.qhead .no { color: var(--accent); font-weight: 700; font-size: 15px; letter-spacing: 0.04em; font-variant-numeric: tabular-nums; }
.tag { border: 1px solid var(--rule); border-radius: 4px; padding: 0 6px; font-size: 12px; }
.progress { margin-left: auto; font-variant-numeric: tabular-nums; }
.bar { height: 3px; background: var(--rule); border-radius: 2px; overflow: hidden; }
.bar i { display: block; height: 100%; background: var(--accent); transition: width .25s; }

.card { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 20px; box-shadow: var(--shadow); display: grid; gap: 14px; }
.stem { white-space: pre-line; font-family: var(--mincho); font-size: 15px; color: var(--ink-soft); margin: 0; }
.ctx { font-family: var(--mincho); font-size: 15px; background: var(--paper); border-radius: 8px; padding: 12px 14px; margin: 0; }
.ctx b, .stmt b { font-family: var(--gothic); font-size: 13px; color: var(--ink-soft); margin-right: 6px; }
.stem-exam { white-space: pre-line; }
.stmt { font-family: var(--mincho); font-size: 19px; line-height: 1.85; margin: 0; white-space: pre-line; }
.stmt .lb { font-family: var(--gothic); font-weight: 700; color: var(--accent); margin-right: 10px; white-space: nowrap; }

.ox { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.ox button {
  min-height: 88px; border-radius: 14px; border: 2px solid var(--rule); background: var(--surface);
  font-family: var(--mincho); font-size: 44px; line-height: 1; font-weight: 700; box-shadow: var(--shadow);
}
.ox button.o { color: var(--good); }
.ox button.x { color: var(--bad); }
.ox button:hover:not(:disabled) { border-color: currentColor; }
.ox button:disabled { cursor: default; opacity: 0.35; box-shadow: none; }
.ox button.picked { opacity: 1; border-color: currentColor; }

.verdict { border-radius: 12px; padding: 16px 20px; display: grid; gap: 10px; }
.verdict.good { background: var(--good-soft); }
.verdict.bad { background: var(--bad-soft); }
.verdict .v { font-size: 20px; font-weight: 700; display: flex; align-items: center; gap: 10px; }
.verdict.good .v { color: var(--good); }
.verdict.bad .v { color: var(--bad); }
.verdict .ans { font-size: 14px; color: var(--ink); font-weight: 400; }
.expl { font-family: var(--mincho); font-size: 16px; margin: 0; white-space: pre-line; }
.fig { margin: 0; background: #fff; border: 1px solid var(--rule); border-radius: 8px; padding: 8px; overflow-x: auto; }
.fig img { display: block; max-width: 100%; height: auto; margin: 0 auto; }
.qnote { font-size: 13px; color: var(--ink-soft); margin: 0; }
.oxnote { font-size: 13px; color: var(--accent); margin: 0; font-weight: 700; }
.expl .judge { font-family: var(--gothic); font-weight: 700; margin-right: 6px; }
.judge.t { color: var(--good); }
.judge.f { color: var(--bad); }

.actions { display: flex; flex-wrap: wrap; gap: 10px; }
.primary { background: var(--accent); color: var(--surface); border: none; border-radius: 10px; padding: 12px 24px; font-weight: 700; min-height: 48px; flex: 1 1 200px; }
.secondary { background: var(--surface); border: 1px solid var(--rule); border-radius: 10px; padding: 12px 18px; min-height: 48px; }

/* 本番5択 */
.choices { display: grid; gap: 10px; }
.choice { font-family: var(--mincho); font-size: 16px; display: grid; grid-template-columns: minmax(28px, max-content) 1fr; gap: 4px; white-space: pre-line; }
.choice .lb { font-family: var(--gothic); font-weight: 700; color: var(--accent); white-space: nowrap; margin-right: 6px; }
.choice .ctxs { grid-column: 2; font-size: 14px; color: var(--ink-soft); }
.opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.opts button { border: 2px solid var(--rule); background: var(--surface); border-radius: 10px; min-height: 64px; display: grid; gap: 2px; place-items: center; padding: 6px 2px; }
.opts button b { font-size: 20px; font-variant-numeric: tabular-nums; }
.opts button span { font-size: 13px; color: var(--ink-soft); }
.opts button.right { border-color: var(--good); background: var(--good-soft); }
.opts button.wrong { border-color: var(--bad); background: var(--bad-soft); }
.opts button:disabled { cursor: default; }
.explist { display: grid; gap: 12px; }
.summary { font-family: var(--mincho); margin: 0; font-weight: 700; }

/* 元のページ */
.pages { display: grid; gap: 12px; }
.pages figure { margin: 0; border: 1px solid var(--rule); border-radius: 8px; overflow: hidden; background: #fff; }
.pages img { display: block; width: 100%; height: auto; }
.pages figcaption { font-size: 12px; color: #55646e; padding: 4px 10px; background: #f2f4f3; }

/* セット */
.sets { display: grid; gap: 12px; }
.sec-h { display: flex; flex-wrap: wrap; align-items: baseline; gap: 6px 12px; }
.sec-h h2 { font-size: 18px; margin: 0; }
.legend { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; color: var(--ink-soft); margin-left: auto; }
.legend b { font-family: var(--mincho); margin-left: 8px; }
.label.inline { margin: 0; align-self: center; }
.setgrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(300px, 100%), 1fr)); gap: 12px; }
.set { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px; display: grid; gap: 12px; box-shadow: var(--shadow); align-content: start; }
.set-top { display: flex; align-items: baseline; gap: 10px; }
.set-top h3 { margin: 0; font-size: 17px; }
.set-top .range { font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.marks { display: flex; flex-wrap: wrap; gap: 2px 10px; font-family: var(--mincho); font-size: 18px; line-height: 1.4; font-weight: 700; }
.marks.big { justify-content: center; font-size: 22px; }
.ok { color: var(--accent); }
.ng { color: var(--bad); }
.yet { color: var(--ink-soft); opacity: 0.5; font-weight: 400; }
.set-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin: 0; }
.set-stats div { display: grid; }
.set-stats dt { font-size: 11px; color: var(--ink-soft); letter-spacing: 0.06em; }
.set-stats dd { margin: 0; font-size: 16px; font-weight: 700; font-variant-numeric: tabular-nums; }
.set-actions { display: flex; gap: 8px; }
.set-actions .primary { flex: 1 1 auto; }
.secondary:disabled { opacity: 0.45; cursor: default; }
.set-tag { background: var(--accent-soft); border-color: transparent; color: var(--accent); font-weight: 700; }
.done .label { margin: 0; }

/* 合言葉・更新のお知らせ */
.lock { margin-top: 32px; }
.lock h1 { margin: 0; font-size: 22px; }
.lock p { margin: 0; }
.pass { font: inherit; font-size: 18px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--rule); background: var(--paper); color: var(--ink); }
.update { position: fixed; left: 16px; right: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 20; max-width: 688px; margin: 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  background: var(--surface); border: 2px solid var(--accent); border-radius: 12px; padding: 12px 16px; box-shadow: var(--shadow); font-weight: 700; }
.update .primary { flex: 0 0 auto; }

.done { text-align: center; padding: 32px 20px; }
.done b { font-size: 40px; font-variant-numeric: tabular-nums; display: block; }
.empty { color: var(--ink-soft); font-size: 14px; }
.note { font-size: 12px; color: var(--ink-soft); }

@media (max-width: 480px) {
  .stmt { font-size: 17px; }
  .opts { grid-template-columns: repeat(5, 1fr); gap: 6px; }
  .opts button span { font-size: 11px; }
  .card { padding: 16px; }
  .brand small { display: none; }
}
@media (prefers-reduced-motion: reduce) { .bar i { transition: none; } }

/* 1周目の記録だけで使う */
.set-actions .secondary { flex: 1 1 auto; }
.items { display: grid; gap: 0; }
.item { padding: 12px 0; border-bottom: 1px dashed var(--rule); display: grid; gap: 6px; }
.item-h { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.item-h .mk { font-family: var(--mincho); font-weight: 700; font-size: 18px; }
.item-h .id { color: var(--accent); font-weight: 700; font-variant-numeric: tabular-nums; }
.item-h .cnt { margin-left: auto; font-size: 13px; color: var(--ink-soft); font-variant-numeric: tabular-nums; }
.item-h .cnt.bad { color: var(--bad); font-weight: 700; }
.item p { margin: 0; font-size: 15px; white-space: pre-line; }
.item .ans { font-size: 13px; color: var(--ink-soft); }
.item details summary { font-size: 13px; color: var(--accent); cursor: pointer; }
.item details p { font-size: 14px; color: var(--ink-soft); margin-top: 6px; }
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand">調査士 1周目の記録<small>見るだけ</small></div>
</div></header>
<main class="wrap" id="app"></main>
<script>
(() => {
  const appEl = document.getElementById("app");
  const show = (...kids) => appEl.replaceChildren(...kids.flat().filter(k => k != null && k !== false));
  const el = (tag, attrs = {}, ...kids) => {
    const n = document.createElement(tag);
    for (const [k, v] of Object.entries(attrs)) {
      if (k === "class") n.className = v;
      else if (k.startsWith("on")) n.addEventListener(k.slice(2), v);
      else if (v === true) n.setAttribute(k, "");
      else if (v !== false && v != null) n.setAttribute(k, v);
    }
    for (const c of kids.flat()) if (c != null && c !== false) n.append(c);
    return n;
  };

  // ---------- 合言葉（ドリルと同じ。この端末では次から自動で開く） ----------
  const enc = new TextEncoder();
  const idb = (mode, fn) => new Promise((res, rej) => {
    const r = indexedDB.open("chousashi-kiroku1", 1);
    r.onupgradeneeded = () => r.result.createObjectStore("kv");
    r.onsuccess = () => {
      const tx = r.result.transaction("kv", mode), q = fn(tx.objectStore("kv"));
      tx.oncomplete = () => res(q && q.result);
      tx.onerror = () => rej(tx.error);
    };
    r.onerror = () => rej(r.error);
  });
  const getKey = () => idb("readonly", st => st.get("key")).catch(() => null);
  const putKey = k => idb("readwrite", st => st.put(k, "key")).catch(() => {});
  async function deriveKey(pass, cfg) {
    const base = await crypto.subtle.importKey("raw", enc.encode(pass), "PBKDF2", false, ["deriveKey"]);
    const salt = Uint8Array.from(atob(cfg.salt), ch => ch.charCodeAt(0));
    return crypto.subtle.deriveKey({ name: "PBKDF2", salt, iterations: cfg.iter, hash: "SHA-256" },
      base, { name: "AES-GCM", length: 256 }, false, ["decrypt"]);
  }
  async function decryptFile(path, key) {
    const res = await fetch(path, { cache: "no-cache" });
    if (!res.ok) throw new Error("fetch " + path);
    const buf = new Uint8Array(await res.arrayBuffer());
    return crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
  }

  // ---------- 1周目の記録 ----------
  // rec[肢] = { a: 解いた回数, w: 間違えた回数, ... }、rec["set/分野/番号"] = { n: 回数, last: 前回, best: 最高, size }
  // ○＝一度も間違えずに正解した肢、×＝1回以上間違えた肢
  let QUESTIONS = [], REC = {};
  const FIELDS = ["民法", "調査士法", "登記"];
  let field = "民法";
  try { field = localStorage.getItem("chousashi-kiroku1-field") || field; } catch (e) {}
  const SET_SIZE = 10;
  const pct = (a, b) => b ? Math.round(a / b * 100) + "%" : "–";
  const items = qs => qs.flatMap(q => q.choices.filter(c => !c.noOx).map(c => ({ q, c, key: `${q.id}/${c.label}` })));
  const missed = it => REC[it.key] && REC[it.key].w > 0;
  const rangeText = its => its[0].q.id === its.at(-1).q.id ? its[0].q.id : `${its[0].q.id}〜${its.at(-1).q.id}`;
  // 組の分け方はドリルと同じ（noOx の肢も席だけ数える）
  function setsOf(f) {
    const its = QUESTIONS.filter(q => q.field === f).flatMap(q => q.choices.map(c => ({ q, c, key: `${q.id}/${c.label}` })));
    const out = [];
    for (let i = 0; i < its.length; i += SET_SIZE) {
      const no = out.length + 1;
      const part = its.slice(i, i + SET_SIZE).filter(it => !it.c.noOx);
      if (!part.length) continue;
      out.push({ no, key: `set/${f}/${no}`, items: part, base: [...new Set(part.map(it => it.q.topic))].join("・") });
    }
    const total = {}, seen = {};
    out.forEach(x => { total[x.base] = (total[x.base] || 0) + 1; });
    out.forEach(x => { seen[x.base] = (seen[x.base] || 0) + 1; x.name = total[x.base] > 1 ? `${x.base}（${seen[x.base]}）` : x.base; });
    return out;
  }

  function itemView(it) {
    const r = REC[it.key], exp = it.c.explanation || it.q.explanation;
    return el("div", { class: "item" },
      el("div", { class: "item-h" },
        r ? el("span", { class: "mk " + (r.w ? "ng" : "ok") }, r.w ? "×" : "○") : el("span", { class: "mk yet" }, "–"),
        el("span", { class: "id" }, `${it.q.id} ${it.c.label}`),
        el("span", { class: "cnt" + (r && r.w ? " bad" : "") }, r ? (r.w ? `${r.w}回間違えた・${r.a}回解いた` : `一度で正解`) : "解いていない")),
      el("p", {}, it.c.text),
      el("p", { class: "ans" }, `答え：${it.c.correct ? "○" : "×"}` + (it.q.oxNote ? `（${it.q.oxNote}）` : "")),
      exp ? el("details", {}, el("summary", {}, "解説を見る"), el("p", {}, exp)) : null);
  }

  function setCard(s) {
    const r = REC[s.key], once = s.items.filter(it => REC[it.key] && !missed(it)).length;
    const box = el("div", { class: "items", hidden: true });
    const btn = el("button", { class: "secondary", onclick: () => {
      if (!box.childElementCount) box.append(...s.items.map(itemView));
      box.hidden = !box.hidden;
      btn.textContent = box.hidden ? "中身を見る" : "閉じる";
    } }, "中身を見る");
    return el("article", { class: "set" },
      el("div", { class: "set-top" }, el("h3", {}, s.name), el("span", { class: "range" }, rangeText(s.items))),
      el("div", { class: "marks", role: "img", "aria-label": `${s.items.length}肢中 一度で正解 ${once}肢` },
        s.items.map(it => { const x = REC[it.key]; return x ? el("span", { class: x.w ? "ng" : "ok" }, x.w ? "×" : "○") : el("span", { class: "yet" }, "–"); })),
      el("dl", { class: "set-stats" },
        el("div", {}, el("dt", {}, "一度で正解"), el("dd", {}, `${once}/${s.items.length}`)),
        el("div", {}, el("dt", {}, "前回"), el("dd", {}, r ? `${r.last}/${r.size}` : "–")),
        el("div", {}, el("dt", {}, "最高"), el("dd", {}, r ? `${r.best}/${r.size}` : "–")),
        el("div", {}, el("dt", {}, "回数"), el("dd", {}, `${r ? r.n : 0}回`))),
      el("div", { class: "set-actions" }, btn),
      box);
  }

  function render() {
    const all = items(QUESTIONS).filter(it => REC[it.key]);
    const miss = all.filter(missed);
    const times = all.reduce((n, it) => n + REC[it.key].a, 0);
    const sets = setsOf(field);
    const hard = items(QUESTIONS).filter(it => it.q.field === field && REC[it.key] && REC[it.key].w >= 2)
      .sort((a, b) => REC[b.key].w - REC[a.key].w);
    show(
      el("section", { class: "hero" },
        el("h1", {}, "1周目の記録"),
        el("p", {}, "2026年10月7日〜11月3日に解いた記録。見るだけで、ここでは何も変わらない")),
      el("div", { class: "stats" },
        el("div", { class: "stat" }, el("b", {}, String(all.length)), el("span", {}, "解いた肢")),
        el("div", { class: "stat" }, el("b", {}, pct(all.length - miss.length, all.length)), el("span", {}, "一度で正解")),
        el("div", { class: "stat" }, el("b", {}, String(times)), el("span", {}, "解いた回数"))),
      el("section", {},
        el("p", { class: "label" }, "分野"),
        el("div", { class: "chips" }, FIELDS.map(v => el("button", {
          class: "chip", "aria-pressed": field === v ? "true" : "false",
          onclick: () => { field = v; try { localStorage.setItem("chousashi-kiroku1-field", v); } catch (e) {} render(); }
        }, v)))),
      el("section", { class: "sets" },
        el("div", { class: "sec-h" },
          el("h2", {}, "1肢ずつ ○×"),
          el("span", { class: "note" }, `${field} ${sets.length}組`),
          el("span", { class: "legend" }, el("b", { class: "ok" }, "○"), "一度で正解", el("b", { class: "ng" }, "×"), "間違えた")),
        el("div", { class: "setgrid" }, sets.map(setCard))),
      hard.length ? el("section", {},
        el("div", { class: "sec-h" }, el("h2", {}, "2回以上間違えた肢"), el("span", { class: "note" }, `${field} ${hard.length}肢・多い順`)),
        el("div", { class: "items" }, hard.map(itemView))) : null);
  }

  function lockScreen() {
    const input = el("input", { id: "pass", type: "password", autocomplete: "current-password", class: "pass", placeholder: "合言葉", "aria-label": "合言葉" });
    const err = el("p", { class: "note", "aria-live": "polite" });
    const go = async () => {
      if (!input.value.trim()) return;
      err.textContent = "確かめています…";
      try {
        const cfg = await (await fetch("config.json", { cache: "no-cache" })).json();
        const k = await deriveKey(input.value.trim(), cfg);
        const data = await decryptFile("data.bin", k);
        await putKey(k);
        start(data);
      } catch (e) {
        err.textContent = "合言葉が違います。もう一度入れてください。（ドリルと同じ合言葉）";
      }
    };
    input.addEventListener("keydown", e => { if (e.key === "Enter") go(); });
    show(el("section", { class: "card lock" },
      el("h1", {}, "調査士 1周目の記録"),
      el("p", {}, "最初の1回だけ、ドリルと同じ合言葉を入れてください。この端末では次から自動で開きます。"),
      input, el("button", { class: "primary", onclick: go }, "開く"), err));
  }
  function start(buf) {
    const d = JSON.parse(new TextDecoder().decode(buf));
    QUESTIONS = d.q; REC = d.rec;
    render();
  }
  (async () => {
    const k = await getKey();
    if (k) { try { start(await decryptFile("data.bin", k)); return; } catch (e) {} }
    lockScreen();
  })();
})();
</script>
</body>
</html>
